<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blueBot</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <button id="pet" type="button" title="点击打开对话 · 拖动可移动" aria-label="blueBot 宠物">
      <img id="pet-img" src="../assets/pet.png" alt="blueBot" draggable="false" />
      <span id="pet-fallback" class="fallback" hidden aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="40" rx="18" ry="16" fill="#3b82f6"/>
          <ellipse cx="32" cy="22" rx="16" ry="14" fill="#60a5fa"/>
          <rect x="20" y="16" width="24" height="14" rx="3" fill="#0f172a"/>
          <text x="24" y="27" fill="#7dd3fc" font-size="10" font-family="monospace">&gt;_</text>
          <text x="26" y="44" fill="#bfdbfe" font-size="9" font-family="monospace">&gt;_</text>
        </svg>
      </span>
      <span id="badge" class="badge" hidden></span>
    </button>
    <script src="./pet.js"></script>
  </body>
</html>
