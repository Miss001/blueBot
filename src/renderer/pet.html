<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blueBot</title>
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <button id="pet" type="button" title="点击打开对话 · 拖动可移动" aria-label="blueBot 宠物">
      <span class="pet-avatar" aria-hidden="true">
        <svg class="pet-svg" viewBox="0 0 96 110" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#7dd3fc"/>
              <stop offset="45%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#1d4ed8"/>
            </linearGradient>
            <linearGradient id="faceGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
            </filter>
          </defs>
          <g class="antenna">
            <line x1="48" y1="18" x2="48" y2="6" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
            <circle class="antenna-tip" cx="48" cy="5" r="4.5" fill="#fbbf24"/>
          </g>
          <circle cx="18" cy="36" r="7" fill="#60a5fa"/>
          <circle cx="78" cy="36" r="7" fill="#60a5fa"/>
          <circle cx="18" cy="36" r="3.5" fill="#1e3a8a"/>
          <circle cx="78" cy="36" r="3.5" fill="#1e3a8a"/>
          <ellipse cx="48" cy="68" rx="28" ry="26" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
          <ellipse cx="48" cy="42" rx="26" ry="22" fill="url(#bodyGrad)"/>
          <rect x="30" y="32" width="36" height="20" rx="6" fill="url(#faceGrad)"/>
          <g class="eyes">
            <circle class="eye left" cx="40" cy="42" r="3.2" fill="#7dd3fc"/>
            <circle class="eye right" cx="56" cy="42" r="3.2" fill="#7dd3fc"/>
          </g>
          <path d="M38 48 Q48 54 58 48" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
          <rect x="38" y="62" width="20" height="14" rx="4" fill="#1e3a8a" opacity="0.85"/>
          <text x="41" y="73" fill="#93c5fd" font-size="9" font-family="Segoe UI Mono, Consolas, monospace">&gt;_</text>
          <ellipse cx="36" cy="92" rx="8" ry="5" fill="#2563eb"/>
          <ellipse cx="60" cy="92" rx="8" ry="5" fill="#2563eb"/>
        </svg>
      </span>
      <span id="badge" class="badge" hidden></span>
    </button>
    <script src="./pet.js"></script>
  </body>
</html>
