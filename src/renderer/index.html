<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blueBot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">blueBot</div>
        <div class="url-bar">
          <button id="btn-back" type="button" title="后退">←</button>
          <button id="btn-forward" type="button" title="前进">→</button>
          <button id="btn-reload" type="button" title="刷新">↻</button>
          <input
            id="url-input"
            type="text"
            spellcheck="false"
            placeholder="输入网址，例如 https://example.com"
          />
          <button id="btn-go" type="button">前往</button>
        </div>
        <div id="agent-status" class="agent-status" title="Agent 配置状态">检测中…</div>
      </header>

      <main class="main">
        <section class="browser-pane">
          <div class="page-meta">
            <span id="page-title">尚未打开页面</span>
            <span id="page-url" class="muted"></span>
            <span id="page-sync" class="sync-badge">等待同步</span>
          </div>
          <webview
            id="browser"
            src="https://example.com"
            allowpopups
            partition="persist:bluebot"
          ></webview>
        </section>

        <aside class="chat-pane">
          <div class="chat-header">
            <h2>对话</h2>
            <p class="muted">Agent 会自动读取当前页面；也可主动调用 get_current_page 工具。</p>
          </div>
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="chat-form">
            <textarea
              id="chat-input"
              rows="3"
              placeholder="例如：根据当前页面，总结要点…"
            ></textarea>
            <button id="btn-send" type="submit">发送</button>
          </form>
        </aside>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
