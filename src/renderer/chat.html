<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blueBot 对话</title>
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 96 110" width="36" height="40" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="bBody" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#7dd3fc"/>
                  <stop offset="100%" stop-color="#1d4ed8"/>
                </linearGradient>
              </defs>
              <line x1="48" y1="18" x2="48" y2="6" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
              <circle cx="48" cy="5" r="4.5" fill="#fbbf24"/>
              <ellipse cx="48" cy="68" rx="28" ry="26" fill="url(#bBody)"/>
              <ellipse cx="48" cy="42" rx="26" ry="22" fill="url(#bBody)"/>
              <rect x="30" y="32" width="36" height="20" rx="6" fill="#0f172a"/>
              <circle cx="40" cy="42" r="3" fill="#7dd3fc"/>
              <circle cx="56" cy="42" r="3" fill="#7dd3fc"/>
              <path d="M38 48 Q48 54 58 48" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <div class="brand-name">blueBot</div>
            <div id="agent-status" class="agent-status">检测中…</div>
          </div>
        </div>
        <div class="titlebar-actions">
          <button id="btn-settings" type="button" class="btn-settings" title="配置 API Key / Base URL / 模型">⚙ 设置</button>
          <button id="btn-refresh" type="button" title="刷新前台窗口">刷新窗口</button>
          <button id="btn-close" type="button" title="关闭">×</button>
        </div>
      </header>

      <section id="settings-panel" class="settings-panel hidden" aria-hidden="true">
        <div class="settings-head">
          <div>
            <div class="settings-title">API 设置</div>
            <div id="settings-status" class="settings-status">未配置</div>
          </div>
          <button id="btn-settings-close" type="button" class="linkish">关闭</button>
        </div>
        <label class="field">
          <span>API Key</span>
          <input id="set-api-key" type="password" autocomplete="off" placeholder="sk-…（留空则保留已有密钥）" />
        </label>
        <label class="field">
          <span>Base URL（可选）</span>
          <input id="set-base-url" type="text" autocomplete="off" placeholder="https://api.openai.com/v1 或兼容中转" />
        </label>
        <label class="field">
          <span>Model</span>
          <input id="set-model" type="text" autocomplete="off" placeholder="gpt-4o-mini" />
        </label>
        <label class="field">
          <span>API Mode</span>
          <select id="set-api-mode">
            <option value="chat_completions">chat_completions（兼容中转）</option>
            <option value="responses">responses</option>
          </select>
        </label>
        <div class="settings-actions">
          <button id="btn-settings-save" type="button">保存并应用</button>
          <button id="btn-toggle-key" type="button" class="ghost">显示密钥</button>
        </div>
        <p class="settings-hint">
          密钥保存在本机 userData 的 settings.json，不会提交到 Git。保存后立即生效，无需改 .env。
        </p>
      </section>

      <section class="focus-card">
        <div class="focus-label">当前关注窗口</div>
        <div id="focus-title" class="focus-title">等待同步…</div>
        <div id="focus-meta" class="focus-meta muted"></div>
      </section>

      <div id="chat-log" class="chat-log" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          rows="3"
          placeholder="例如：根据当前窗口，总结要点…"
        ></textarea>
        <button id="btn-send" type="submit">发送</button>
      </form>
    </div>
    <script src="./chat.js"></script>
  </body>
</html>
